plugins {
	id 'dev.architectury.loom-no-remap'
	id 'dev.architectury.loom'
	id 'io.github.brainage04.mod-publishing' version "${fabricmoddingconventions_version}"
}
base { archivesName = "${rootProject.archives_base_name}-neoforge" }
loom { neoForge { }; mods { main { sourceSet sourceSets.main; sourceSet project(':common').sourceSets.main } }; runs { client { runDir 'run/client' } } }
configurations { common { canBeResolved = true; canBeConsumed = false }; compileClasspath.extendsFrom common; runtimeClasspath.extendsFrom common; twitchLibraries { canBeResolved = true; canBeConsumed = false; exclude group: 'org.slf4j', module: 'slf4j-api'; exclude group: 'commons-io', module: 'commons-io'; exclude group: 'org.apache.commons', module: 'commons-lang3' } }
dependencies { minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"; neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"; common(project(':common')) { transitive = false }; twitchLibraries "com.github.twitch4j:twitch4j:${rootProject.twitch4j_version}"; implementation files(configurations.twitchLibraries); configurations.twitchLibraries.resolvedConfiguration.resolvedArtifacts.each { artifact -> include("${artifact.moduleVersion.id.group}:${artifact.name}:${artifact.moduleVersion.id.version}") { transitive = false } } }
modPublishing {
	version.set("${rootProject.mod_version}-neoforge")
	releaseTag.set("v${rootProject.mod_version}")
	displayName.set("${rootProject.mod_name} ${rootProject.mod_version} (NeoForge)")
	modLoaders.set(['neoforge'])
	fabricModJson.set(rootProject.layout.projectDirectory.file('fabric/build/resources/main/fabric.mod.json'))
	licenseFile.set(rootProject.layout.projectDirectory.file('LICENSE'))
	modrinth.projectConfig.set(rootProject.layout.projectDirectory.file('.modrinth/project.json'))
	modrinth.projectBody.set(rootProject.layout.projectDirectory.file('README.md'))
	modrinth.iconFile.set(rootProject.layout.projectDirectory.file('common/src/main/resources/assets/simpletwitchchat/icon.png'))
	curseforge.client.set(true)
	curseforge.server.set(false)
}
tasks.named('validateModPublication') { dependsOn ':fabric:processResources' }
tasks.named('jar') { from project(':common').sourceSets.main.output; duplicatesStrategy = DuplicatesStrategy.EXCLUDE; from(rootProject.file('LICENSE')) { rename { "${it}_${rootProject.archives_base_name}-neoforge" } } }
tasks.named('sourcesJar') { from project(':common').sourceSets.main.allSource }
tasks.matching { it.name.startsWith('run') }.configureEach { dependsOn project(':common').tasks.named('jar') }
