plugins {
	id 'io.github.brainage04.fabric-mod-conventions' version "${fabricmoddingconventions_version}"
	id 'io.github.brainage04.client-gametest-recorder' version "${fabricmoddingconventions_version}"
	id 'io.github.brainage04.production-gametests' version "${fabricmoddingconventions_version}"
	id 'io.github.brainage04.workspace-dependencies' version "${fabricmoddingconventions_version}"
	id 'io.github.brainage04.mod-publishing' version "${fabricmoddingconventions_version}"
}
base { archivesName = rootProject.archives_base_name }
loom { mods { main { sourceSet sourceSets.main; sourceSet project(':common').sourceSets.main } }; runs { client { runDir 'run/client' } } }
configurations { common { canBeResolved = true; canBeConsumed = false }; compileClasspath.extendsFrom common; runtimeClasspath.extendsFrom common; developmentFabric.extendsFrom common; twitchLibraries { canBeResolved = true; canBeConsumed = false; exclude group: 'org.slf4j', module: 'slf4j-api'; exclude group: 'commons-io', module: 'commons-io'; exclude group: 'org.apache.commons', module: 'commons-lang3' } }
workspaceDependencies { siblingMaven('FabricModdingConventions') { coordinate.set("io.github.brainage04:fabricmoddingconventions:${project.fabricmoddingconventions_version}"); siblingDirectory.set(rootProject.layout.projectDirectory.dir('../FabricModdingConventions')) } }
dependencies { common(project(':common')) { transitive = false }; implementation "io.github.brainage04:fabricmoddingconventions:${project.fabricmoddingconventions_version}"; twitchLibraries "com.github.twitch4j:twitch4j:${rootProject.twitch4j_version}"; implementation files(configurations.twitchLibraries); configurations.twitchLibraries.resolvedConfiguration.resolvedArtifacts.each { artifact -> include("${artifact.moduleVersion.id.group}:${artifact.name}:${artifact.moduleVersion.id.version}") { transitive = false } } }
productionGameTests { includeClient.set(true); runtimeLibraryDependencies.set(configurations.twitchLibraries.resolvedConfiguration.resolvedArtifacts.collect { "${it.moduleVersion.id.group}:${it.name}:${it.moduleVersion.id.version}" }) }
clientGameTestRecorder { guiScale.set('3') }
modPublishing {
	github.repository.set('brainage04/SimpleTwitchChat')
	licenseFile.set(rootProject.layout.projectDirectory.file('LICENSE'))
	modrinth.projectConfig.set(rootProject.layout.projectDirectory.file('.modrinth/project.json'))
	modrinth.projectBody.set(rootProject.layout.projectDirectory.file('README.md'))
	modrinth.iconFile.set(rootProject.layout.projectDirectory.file('common/src/main/resources/assets/simpletwitchchat/icon.png'))
	curseforge.client.set(true)
	curseforge.server.set(false)
}
tasks.named('jar') { from project(':common').sourceSets.main.output; duplicatesStrategy = DuplicatesStrategy.EXCLUDE }
tasks.named('sourcesJar') { from project(':common').sourceSets.main.allSource }
tasks.matching { it.name.startsWith('run') }.configureEach { dependsOn project(':common').tasks.named('jar') }
