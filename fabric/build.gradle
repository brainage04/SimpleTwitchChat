plugins {
	id 'info.solidsoft.pitest' version '1.19.0'
}

configurations {
	twitchLibraries {
		canBeResolved = true
		canBeConsumed = false
		exclude group: 'org.slf4j', module: 'slf4j-api'
		exclude group: 'commons-io', module: 'commons-io'
		exclude group: 'org.apache.commons', module: 'commons-lang3'
	}
}


dependencies {
	twitchLibraries "com.github.twitch4j:twitch4j:${rootProject.twitch4j_version}"
	implementation files(configurations.twitchLibraries)
	configurations.twitchLibraries.resolvedConfiguration.resolvedArtifacts.each { artifact ->
		include("${artifact.moduleVersion.id.group}:${artifact.name}:${artifact.moduleVersion.id.version}") {
			transitive = false
		}
	}

	testImplementation platform('org.junit:junit-bom:6.0.3')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation 'org.mockito:mockito-core:5.24.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
productionGameTests {
	runtimeLibraryDependencies.set(configurations.twitchLibraries.resolvedConfiguration.resolvedArtifacts.collect {
		"${it.moduleVersion.id.group}:${it.name}:${it.moduleVersion.id.version}"
	})
}

pitest {
	pitestVersion = '1.30.2'
	junit5PluginVersion = '1.2.3'
	targetClasses = ['io.github.brainage04.simpletwitchchat.twitch.ChatbotSession']
	targetTests = ['io.github.brainage04.simpletwitchchat.twitch.ChatbotSessionTest']
	additionalMutableCodePaths = project(':common').sourceSets.main.output.classesDirs.files
	threads = 1
	timeoutConstInMillis = 5000
	outputFormats = ['HTML', 'XML']
	timestampedReports = false
}
tasks.named('pitest') {
	dependsOn ':common:classes'
	// With fabric-loader-junit on the classpath, the tests run but PIT records no coverage (0 of 90 lines),
	// so every mutant counts as uncovered. ChatbotSessionTest does not need the Fabric loader.
	def classpath = files(additionalClasspath.from.toList())
	additionalClasspath.setFrom(classpath.filter { !it.name.startsWith('fabric-loader-junit') })
}
