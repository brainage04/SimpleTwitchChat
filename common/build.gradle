plugins {
	id 'dev.architectury.loom-no-remap'
	id 'dev.architectury.loom'
}
sourceSets {
	main { java.srcDirs = [rootProject.file('common/src/main/java')]; resources.srcDirs = [rootProject.file('common/src/main/resources')] }
	test { java.srcDir rootProject.file('common/src/test/java') }
}
configurations {
	twitchLibraries { canBeResolved = true; canBeConsumed = false; exclude group: 'org.slf4j', module: 'slf4j-api'; exclude group: 'commons-io', module: 'commons-io'; exclude group: 'org.apache.commons', module: 'commons-lang3' }
}
dependencies {
	minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
	compileOnly "net.fabricmc:fabric-loader:${rootProject.loader_version}"
	compileOnly files(configurations.twitchLibraries)
	twitchLibraries "com.github.twitch4j:twitch4j:${rootProject.twitch4j_version}"
	testImplementation platform('org.junit:junit-bom:6.0.3')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
